[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texas-court-records-scraper"
version = "0.1.0"
description = "Portfolio-grade, config-driven framework for scraping civil court case + attorney data from county court portals. Runs fully offline against synthetic fixtures."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Max Modulus" }]
keywords = ["web-scraping", "data-engineering", "pandas", "etl", "portfolio"]

dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]
# A Playwright driver would slot in here for the JavaScript-portal adapter.
playwright = ["playwright>=1.44"]

[project.scripts]
court-scraper = "court_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
court_scraper = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
